<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0"
    <title>Registration Form</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h2>Student Registration Form</h2>

        <form>
            <!--I. Text Box -->
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!--II. Dropdown Box -->
            <div class="form-group">
                <label for="course">Course/Program:</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select your course</option>
                    <option value="bcs">Computer Science</option>
                </select>
            </div>

            <!--III. Radio Buttons-->
            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div>
            </div>

            <!--IV. Checkboxes-->
            <div class="form-group">
                <label>Technical Skills / Interests:</label>
                <duv class="checkbox-group">
                    <input type="checkbox" id="html-css" name="skills" value="html-css">
                    <label for="html-css">HTML/CSS</label>

                    <input type="checkbox" id="javascript" name="skills" value="javascipt">
                    <label for="javascript">JavaScript</label>

                    <input type="checkbox" id="python" name="skills" value="python">
                    <label for="python">Python</label>
                </duv>
            </div>

            <!--V. Action Buttons-->
            <div class="btn-container">
                <button type="reset" class="btn-reset">Reset</button>
                <button type="submit" class="btn-submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
